<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Puck Minimal Test</title>
  <link rel="stylesheet" href="https://esm.sh/@measured/puck@0.20.2/puck.css" />
  <script async src="https://unpkg.com/es-module-shims@1.8.2/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom": "https://esm.sh/react-dom@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "htm": "https://esm.sh/htm@3.1.1?external=react",
      "@measured/puck": "https://esm.sh/@measured/puck@0.20.2?external=react,react-dom&bundle"
    }
  }
  </script>
</head>
<body style="margin:0;font-family:system-ui">
  <div style="padding:12px;background:#0f1220;color:#e6e9f5">Puck Minimal Test — if you see Heading+Text below, Puck works. Check console.</div>
  <div id="root"></div>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import htm from "htm";
    import { Puck } from "@measured/puck";
    const html = htm.bind(React.createElement);
    const config = {
      components: {
        Heading: {
          fields: { text: {type:"text"}, align:{type:"radio", options:[{label:"Left",value:"left"},{label:"Center",value:"center"}]} },
          defaultProps: {text:"Hello Puck", align:"left"},
          render: ({text, align}) => html`<div style=${{textAlign:align, padding:"12px", fontSize:"20px", fontWeight:700}}>${text}</div>`
        },
        Text: {
          fields: { text: {type:"textarea"} },
          defaultProps: {text:"Sample text"},
          render: ({text}) => html`<div style=${{padding:"12px"}}>${text}</div>`
        }
      }
    };
    const data = { root:{props:{title:"Test"}}, content:[{type:"Heading", props:{id:"h1", text:"Test Heading", align:"center"}},{type:"Text", props:{id:"t1", text:"If you see this, Puck data loading works"}}], zones:{} };
    console.log("[Puck Test] config", config);
    console.log("[Puck Test] data", data);
    function App(){
      const [puckData, setPuckData] = React.useState(data);
      console.log("[Puck Test] App render", puckData.content.length);
      return html`<${Puck} config=${config} data=${puckData} onChange=${setPuckData} />`;
    }
    const root = createRoot(document.getElementById("root"));
    root.render(html`<${App} />`);
    console.log("[Puck Test] mounted");
  </script>
</body>
</html>
